name: Publish Kodi repository

on:
  push:
    branches:
      - main
    paths:
      - addons.json
      - tools/**
      - .github/workflows/publish.yml
      - README.md
  repository_dispatch:
    types:
      - addon_updated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kodi-repository-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Kodi repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KODI_OUTPUT_DIR: repo
          KODI_SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          KODI_SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: python3 tools/build_repository.py

      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          if git diff --cached --quiet; then
            echo "No generated repository changes to commit."
          else
            git commit -m "Publish Kodi repository"
            git push
          fi
