name: Publish Kodi repository

on:
  push:
    branches:
      - main
    paths:
      - addons.json
      - tools/**
      - .github/workflows/publish.yml
      - README.md
  repository_dispatch:
    types:
      - addon_updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-repository-pages
  cancel-in-progress: false

jobs:
  publish:
    # The Starlight texture tests compare PNG bytes rendered by librsvg 2.58
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install add-on test dependencies
        # Used by the per-add-on "tests" commands in addons.json
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-2 ffmpeg
          python3 -m pip install --disable-pip-version-check pytest polib requests pillow==11.1.0

      - name: Test the repository builder
        run: python3 -m unittest discover -s tests

      - name: Build Kodi repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KODI_SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          KODI_SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: python3 tools/build_repository.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages
        id: verification
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_pages.py public/source-manifest.json --base-url "$PAGES_URL"

      - name: Retry GitHub Pages deployment
        id: redeployment
        if: steps.deployment.outcome == 'failure' || steps.verification.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages after retry
        if: steps.redeployment.outcome == 'success'
        env:
          PAGES_URL: ${{ steps.redeployment.outputs.page_url }}
        run: python3 tools/verify_pages.py public/source-manifest.json --base-url "$PAGES_URL"
