name: Publish Kodi repository

on:
  push:
    branches:
      - main
    paths:
      - addons.json
      - tools/**
      - .github/workflows/publish.yml
      - README.md
  repository_dispatch:
    types:
      - addon_updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kodi-repository-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install add-on test dependencies
        # Used by the per-add-on "tests" commands in addons.json
        run: python3 -m pip install --disable-pip-version-check pytest polib requests

      - name: Build Kodi repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KODI_SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          KODI_SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: python3 tools/build_repository.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
